<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade de Ciências — Revisão</title>
<style>
:root{
  --azul-900:#0f2a4d; --azul-700:#1a3c6e; --azul-500:#2f5aa8;
  --cinza-900:#20242c; --cinza-600:#5b6270; --cinza-300:#d7dbe2; --cinza-100:#f4f6f9;
  font-family:'Segoe UI', Inter, system-ui, -apple-system, Arial, sans-serif;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--cinza-100); color:var(--cinza-900); -webkit-font-smoothing:antialiased; }
header.top{ background:linear-gradient(135deg, var(--azul-900), var(--azul-500)); color:#fff; padding:24px 28px 20px; box-shadow:0 4px 18px rgba(15,42,77,.25);}
header.top .eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.8; font-weight:600; margin-bottom:6px;}
header.top h1{ margin:0 0 6px; font-size:22px; font-weight:800;}
header.top p{ margin:0; font-size:13px; opacity:.88; max-width:720px; line-height:1.5;}
.controls{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:16px;}
button{ font-family:inherit; font-size:14px; border:none; border-radius:8px; cursor:pointer; }
button.primary{ background:#fff; color:var(--azul-700); font-weight:800; padding:10px 18px; box-shadow:0 2px 6px rgba(0,0,0,.15);}
button.primary:hover{ background:#eef3fb; }
button.primary:disabled{ opacity:.5; cursor:not-allowed; }
button.link-like{ background:none; color:#fff; text-decoration:underline; font-weight:700; padding:4px; box-shadow:none; }
main{ max-width:800px; margin:0 auto; padding:22px 20px 60px; }

.selecao{ background:#fff; border:1px solid var(--cinza-300); border-radius:12px; padding:34px 30px; max-width:520px; margin:30px auto; }
.selecao h2{ margin:0 0 6px; font-size:18px; color:var(--azul-900); }
.selecao p{ margin:0 0 22px; font-size:13.5px; color:var(--cinza-600); line-height:1.5; }
.campo-select{ margin-bottom:16px; }
.campo-select label{ display:block; font-size:12.5px; font-weight:700; color:var(--cinza-600); margin-bottom:6px; }
.campo-select select{
  width:100%; padding:11px 14px; border-radius:8px; border:1.5px solid var(--cinza-300);
  font-size:14px; font-family:inherit; background:#fff; color:var(--cinza-900);
}
.campo-select select:disabled{ background:var(--cinza-100); color:var(--cinza-600); }

.folha{ background:#fff; border:1px solid var(--cinza-300); border-radius:10px; padding:30px 34px 26px; box-shadow:0 1px 4px rgba(20,30,50,.05); }
.cabecalho-escola{ text-align:center; font-weight:800; font-size:14.5px; letter-spacing:.02em; margin-bottom:16px;}
.linha-campo{ display:flex; gap:24px; font-size:13.5px; margin-bottom:9px; flex-wrap:wrap; }
.linha-campo .campo{ flex:1; min-width:220px; border-bottom:1px solid var(--cinza-900); padding-bottom:4px; }
.linha-campo .campo b{ font-weight:700; }
.titulo-atividade{ text-align:center; font-weight:800; font-size:15.5px; text-transform:uppercase; letter-spacing:.03em; margin:18px 0 4px; color:var(--azul-900);}
.subtitulo-atividade{ text-align:center; font-size:12px; color:var(--cinza-600); margin-bottom:20px; }
.questao{ margin-bottom:18px; page-break-inside:avoid; }
.questao .enun{ font-size:13.5px; font-weight:600; margin-bottom:4px; line-height:1.5;}
.questao .enun .numero{ color:var(--azul-700); font-weight:800; margin-right:5px;}
.alternativas{ list-style:none; margin:0; padding:0; }
.alternativas li{
  font-size:13px; line-height:1.4; position:relative;
  padding:10px 14px 10px 38px; margin-bottom:9px; border-radius:9px;
  background:linear-gradient(145deg, #ffffff, #eef1f5);
  box-shadow:3px 3px 7px rgba(30,40,60,.16), -3px -3px 7px rgba(255,255,255,.85);
  border:1px solid rgba(20,30,50,.05);
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
  user-select:none;
}
.alternativas li:hover{ transform:translateY(-1px); }
.alternativas li .letra{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:19px; height:19px; border-radius:5px; border:1.4px solid var(--cinza-900);
  font-size:11px; font-weight:800; text-align:center; line-height:17px; background:#fff;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.alternativas li.marcada{ background:#1b5e20; color:#fff; box-shadow:inset 2px 2px 6px rgba(0,0,0,.45), inset -2px -2px 5px rgba(255,255,255,.05); transform:translateY(1px); }
.alternativas li.marcada .letra{ background:#1b5e20; border-color:#fff; color:#fff; }
.aviso{ max-width:800px; margin:40px auto; background:#fff; border:1px solid var(--cinza-300); border-radius:10px; padding:26px; text-align:center; color:var(--cinza-600); }
.rodape-envio{ margin-top:26px; padding-top:22px; border-top:2px solid var(--cinza-300); text-align:center; }
.btn-enviar{
  padding:13px 32px; background:var(--azul-700); color:#fff; font-weight:800;
  border-radius:9px; font-size:15px; box-shadow:0 2px 8px rgba(26,60,110,.25);
}
.btn-enviar:hover{ background:var(--azul-900); }
.btn-enviar:disabled{ background:var(--cinza-300); color:var(--cinza-600); cursor:not-allowed; box-shadow:none; }
#statusEnvio{ margin-top:12px; font-size:13px; color:var(--cinza-600); }
@media print{
  header.top{ display:none !important; }
  body{ background:#fff; }
  main{ max-width:none; padding:0; margin:0; }
  .folha{ box-shadow:none; border:none; border-radius:0; padding:10mm 14mm; }
  .alternativas li{ box-shadow:none; background:#fff !important; color:#000 !important; border:1px solid var(--cinza-300); }
  .alternativas li .letra{ background:#fff !important; color:#000 !important; border-color:#000 !important; }
}

.questao img{ max-width:100%; height:auto; border-radius:8px; margin:10px auto; display:block; box-shadow:0 2px 8px rgba(0,0,0,.1); }
@media print{ .questao img{ box-shadow:none; border:1px solid var(--cinza-300); } }
</style>
</head>

<script>
const DADOS = JSON.parse(document.getElementById('dados-turmas').textContent);
const LETRAS = ['A','B','C','D'];

// Cole aqui a URL do Apps Script publicado como "Aplicativo da Web" (termina em /exec).
// Veja as instruções no topo do arquivo Code.gs.
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxpY_PUQdDl4_4P86xDcnNwvTY19-mokhueqlFUAcOl_FKMeJUwLIoB8WOU88WO-iw/exec';

let turmaAtual = null;
let duplaIdxAtual = null;
let duplaAtual = null;

function pegarParam(nome){
  return new URLSearchParams(window.location.search).get(nome);
}

function nomeDuplaHtml(dp){
  if(dp.mentor) return `${dp.apoio.nome}  &amp;  ${dp.mentor.nome}`;
  return `${dp.apoio.nome}  &amp;  (sem mentor — apoio direto do professor)`;
}

function dataAtualFormatada(){
  const hoje = new Date();
  const dia = String(hoje.getDate()).padStart(2, '0');
  const mes = String(hoje.getMonth() + 1).padStart(2, '0');
  const ano = hoje.getFullYear();
  return `${dia} / ${mes} / ${ano}`;
}

function renderQuestoes(questoes){
  return questoes.map((q, i) => {
    const alts = q.alternativas.map((alt, j) => {
      return `<li data-alt="${j}"><span class="letra">${LETRAS[j]}</span>${alt}</li>`;
    }).join('');
    return `<div class="questao" data-q="${i}">
      <div class="enun"><span class="numero">${i+1}.</span>${q.pergunta}</div>
      ${q.imagemSvg || ''}
      <ul class="alternativas">${alts}</ul>
    </div>`;
  }).join('');
}

let respostasAtuais = [];

function ativarMarcacao(totalQuestoes){
  respostasAtuais = new Array(totalQuestoes).fill(null);
  document.querySelectorAll('.questao').forEach(q => {
    const qIdx = parseInt(q.dataset.q, 10);
    const itens = q.querySelectorAll('.alternativas li');
    itens.forEach(li => {
      li.addEventListener('click', () => {
        itens.forEach(o => o.classList.remove('marcada'));
        li.classList.add('marcada');
        respostasAtuais[qIdx] = parseInt(li.dataset.alt, 10);
        atualizarStatusEnvio();
      });
    });
  });
}

function renderSelecao(){
  document.getElementById('tituloHeader').textContent = 'Atividade de Revisão';
  document.getElementById('subHeader').textContent = 'Selecione sua turma e a sua dupla para abrir a atividade.';
  document.title = 'Atividade de Ciências — Revisão';

  const turmasOrdenadas = Object.keys(DADOS);
  const main = document.getElementById('main');
  main.innerHTML = `<div class="selecao">
    <h2>Encontrar minha atividade</h2>
    <p>Escolha sua turma e depois a sua dupla na lista (os dois nomes aparecem juntos). A atividade abre automaticamente.</p>
    <div class="campo-select">
      <label for="selTurma">Sua turma</label>
      <select id="selTurma">
        <option value="">Selecione a turma...</option>
        ${turmasOrdenadas.map(slug => `<option value="${slug}">${DADOS[slug].nomeTurma}</option>`).join('')}
      </select>
    </div>
    <div class="campo-select">
      <label for="selAluno">Sua dupla</label>
      <select id="selAluno" disabled>
        <option value="">Selecione a turma primeiro...</option>
      </select>
    </div>
  </div>`;

  const selTurma = document.getElementById('selTurma');
  const selAluno = document.getElementById('selAluno');

  selTurma.addEventListener('change', () => {
    const slug = selTurma.value;
    if(!slug){
      selAluno.innerHTML = '<option value="">Selecione a turma primeiro...</option>';
      selAluno.disabled = true;
      return;
    }
    const duplas = DADOS[slug].duplas;
    const opcoes = duplas.map((dp, i) => {
      const rotulo = dp.mentor ? `${dp.apoio.nome}  &amp;  ${dp.mentor.nome}` : `${dp.apoio.nome}  &amp;  (sem mentor)`;
      return `<option value="${i+1}">${rotulo}</option>`;
    }).join('');
    selAluno.innerHTML = '<option value="">Selecione sua dupla...</option>' + opcoes;
    selAluno.disabled = false;
  });

  selAluno.addEventListener('change', () => {
    const slug = selTurma.value;
    const duplaIdx = parseInt(selAluno.value, 10);
    if(!slug || !duplaIdx) return;
    const url = new URL(window.location);
    url.searchParams.set('turma', slug);
    url.searchParams.set('dupla', duplaIdx);
    window.history.pushState({}, '', url);
    renderAtividade(slug, duplaIdx);
  });
}

function renderAtividade(turmaSlug, duplaIdx){
  const dados = DADOS[turmaSlug];
  const main = document.getElementById('main');

  if(!dados || !duplaIdx || duplaIdx < 1 || duplaIdx > dados.duplas.length){
    renderSelecao();
    return;
  }

  const dp = dados.duplas[duplaIdx - 1];
  document.getElementById('tituloHeader').textContent = `Atividade de Revisão — ${dados.nomeTurma}`;
  document.getElementById('subHeader').textContent =
    `10 questões de revisão sobre as habilidades prioritárias da turma ${dados.nomeTurma} (1º e 2º Bimestres de 2026).`;
  document.title = `Atividade — ${dp.apoio.nome} — ${dados.nomeTurma}`;

  turmaAtual = turmaSlug;
  duplaIdxAtual = duplaIdx;
  duplaAtual = dp;

  main.innerHTML = `<div class="folha">
    <div class="cabecalho-escola">E.E. PROFª WANDA MASCAGNI DE SÁ</div>
    <div class="linha-campo"><div class="campo"><b>NOME:</b> ${nomeDuplaHtml(dp)}</div></div>
    <div class="linha-campo">
      <div class="campo" style="flex:0 0 260px;"><b>SÉRIE:</b> ${dados.nomeTurma}</div>
      <div class="campo"><b>DATA:</b> ${dataAtualFormatada()}</div>
    </div>
    <div class="titulo-atividade">Atividade de Ciências — Revisão</div>
    <div class="subtitulo-atividade">10 questões de revisão · habilidades com maior necessidade de reforço na turma</div>
    ${renderQuestoes(dados.questoes)}
    <div class="rodape-envio">
      <button class="btn-enviar" id="btnEnviar">Enviar respostas</button>
      <div id="statusEnvio"></div>
    </div>
  </div>`;
  ativarMarcacao(dados.questoes.length);
  document.getElementById('btnEnviar').addEventListener('click', enviarRespostas);
}

function atualizarStatusEnvio(){
  const respondidas = respostasAtuais.filter(r => r !== null).length;
  const total = respostasAtuais.length;
  const el = document.getElementById('statusEnvio');
  if(respondidas < total){
    el.textContent = `${respondidas} de ${total} questões respondidas.`;
  } else {
    el.textContent = `Todas as ${total} questões respondidas — clique em "Enviar respostas".`;
  }
}

async function enviarRespostas(){
  const btn = document.getElementById('btnEnviar');
  const status = document.getElementById('statusEnvio');

  if(WEBAPP_URL.indexOf('COLE_AQUI') !== -1){
    status.textContent = 'Envio ainda não configurado pelo professor (URL do Apps Script pendente).';
    return;
  }
  if(!turmaAtual || !duplaIdxAtual){
    status.textContent = 'Nenhuma atividade carregada.';
    return;
  }

  const semRespostas = respostasAtuais.filter(r => r === null).length;
  if(semRespostas > 0){
    const confirmar = confirm(`Ainda faltam ${semRespostas} questão(ões) sem resposta. Enviar mesmo assim?`);
    if(!confirmar) return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';
  status.textContent = 'Enviando respostas para a planilha...';

  const payload = {
    turma: turmaAtual,
    duplaIndex: duplaIdxAtual,
    apoioNome: duplaAtual.apoio.nome,
    mentorNome: duplaAtual.mentor ? duplaAtual.mentor.nome : '',
    respostas: respostasAtuais,
  };

  try{
    await fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    status.textContent = '✓ Respostas enviadas! Obrigado, dupla.';
    btn.textContent = 'Respostas enviadas ✓';
  } catch(err){
    status.textContent = 'Não foi possível enviar (verifique sua conexão com a internet) — tente novamente.';
    btn.disabled = false;
    btn.textContent = 'Enviar respostas';
  }
}

(function init(){
  const turmaSlug = pegarParam('turma');
  const duplaIdx = parseInt(pegarParam('dupla'), 10);
  if(turmaSlug && duplaIdx){
    renderAtividade(turmaSlug, duplaIdx);
  } else {
    renderSelecao();
  }
})();
</script>
